<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GitStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Bem-vindo à GitStore</h1>
    </header>
    <main>
        <script src="randompage.js"></script>
        <p>E-commerce da Equipe 8 - Aproveite as ofertas!</p>
        <section class="products-grid" aria-label="Produtos em destaque">
            <div class="product-card">
                <a href="detalhes.html" style="text-decoration: none; color: inherit;">
                    <span class="badge">Novo</span> <img src="product/imgteste.png" alt="Octocat">
                    <div class="card-name">Octocat</div>
                    <div class="card-price">R$ 89,90</div> </a>
            </div>

            <div class="product-card">
                <a href="detalhes-caneca.html" style="text-decoration: none; color: inherit;">
                    <img src="product/caneca.png" alt="Caneca">
                    <div class="card-name">Caneca Invertocat</div>
                    <div class="card-price">R$ 45,00</div> </a>
            </div>

            <div class="product-card">
                <a href="detalhes-copilotcabeça.html" style="text-decoration: none; color: inherit;">
                    <img src="product/copilot.png" alt="Copilot">
                    <div class="card-name">Chaveiro do Copilot</div>
                    <div class="card-price">R$ 25,90</div> </a>
            </div>
        </section>
        <div style="margin-top:16px;">
        <button class="btn-comprar">Comprar Agora</button>
       <button class="btn-detalhes" onclick="GoToRandomPage()">Produto Aleatório</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 GitStore - Todos os direitos reservados.</p>
        <p style="margin-top: 10px;">
            <a href="#">Instagram</a> | <a href="#">Twitter</a>
        </p>
    </footer>

</body>
</html>
