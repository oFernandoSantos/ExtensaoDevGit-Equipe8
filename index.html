<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <h1>GitStore</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Ofertas</a>
                <a href="#">Contato</a>
            </nav>
        </div>
    </header>

    <main>
        <script src="randompage.js"></script>

        <section class="hero">
            <h2>E-commerce da Equipe 8</h2>
            <p>Aproveite as ofertas exclusivas para devs!</p>
            <div class="hero-btns">
                <button class="btn-comprar">Comprar Agora</button>
                <button class="btn-detalhes" onclick="GoToRandomPage()">Produto Aleatório</button>
            </div>
        </section>

        <div class="container">
            <h3 class="section-title">Destaques</h3>
            
            <section class="products-grid" aria-label="Produtos em destaque">
                
                <div class="product-card">
                    <a href="detalhes.html">
                        <span class="badge">Novo</span>
                        <img src="product/imgteste.png" alt="Octocat">
                        <div class="card-info"> <div class="card-name">Octocat</div>
                            <div class="card-price">R$ 89,90</div>
                        </div>
                    </a>
                </div>

                <div class="product-card">
                    <a href="detalhes-caneca.html">
                        <img src="product/caneca.png" alt="Caneca">
                        <div class="card-info">
                            <div class="card-name">Caneca Invertocat</div>
                            <div class="card-price">R$ 45,00</div>
                        </div>
                    </a>
                </div>

                <div class="product-card">
                    <a href="detalhes-copilotcabeça.html">
                        <img src="product/copilot.png" alt="Copilot">
                        <div class="card-info">
                            <div class="card-name">Chaveiro do Copilot</div>
                            <div class="card-price">R$ 25,90</div>
                        </div>
                    </a>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 GitStore - Todos os direitos reservados.</p>
        <p style="margin-top: 10px;">
            <a href="#">Instagram</a> | <a href="#">Twitter</a>
        </p>
    </footer>
</body>
</html>
